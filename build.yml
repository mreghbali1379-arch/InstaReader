name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack the project zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No zip file found in the repository root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p src_project
          unzip -q "$ZIP" -d src_project
          SETTINGS=$(find src_project -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found inside the zip"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Download OCR language data (Persian and English)
        working-directory: ${{ env.ROOT }}
        run: |
          mkdir -p app/src/main/assets/tessdata app/src/main/assets/tessdata_best
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
            curl -L -f -o app/src/main/assets/tessdata_best/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
          done

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ketabkhan-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ketabkhan (latest build)
          files: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
